<!DOCTYPE html> 

<html> 

<head> 

<title>Number Programs</title> 

 

<style> 

 

body{ 

font-family: "Segoe UI", Arial, sans-serif; 

background:#eef3ef; 

display:flex; 

justify-content:center; 

align-items:center; 

height:100vh; 

margin:0; 

} 

 

.container{ 

background:white; 

padding:35px; 

border-radius:16px; 

box-shadow:0 8px 20px rgba(0,0,0,0.08); 

text-align:center; 

width:330px; 

} 

 

h1{ 

color:#3f5f52; 

margin-bottom:20px; 

} 

 

input{ 

width:85%; 

padding:10px; 

border-radius:8px; 

border:1px solid #cfd8d3; 

font-size:15px; 

margin-bottom:20px; 

outline:none; 

} 

 

input:focus{ 

border-color:#8fae9c; 

} 

 

button{ 

padding:9px 14px; 

margin:6px; 

border:none; 

border-radius:20px; 

font-size:14px; 

cursor:pointer; 

background:#8fae9c; 

color:white; 

transition:0.2s; 

} 

 

button:hover{ 

background:#6f8f7f; 

} 

 

#output{ 

margin-top:20px; 

padding:15px; 

border-radius:8px; 

background:#f5f7f6; 

font-size:17px; 

color:#2f3e38; 

} 

 

</style> 

</head> 

 

<body> 

 

<div class="container"> 

 

<h1>Number Programs</h1> 

 

<input type="number" id="num" placeholder="Enter a number"> 

 

<br> 

 

<button onclick="checkEven()">Even</button> 

<button onclick="checkOdd()">Odd</button> 

<button onclick="checkPrime()">Prime</button> 

<button onclick="factorial()">Factorial</button> 

<button onclick="armstrong()">Armstrong</button> 

 

<div id="output">Output will appear here</div> 

 

</div> 

 

<script> 

 

function getNumber(){ 

return parseInt(document.getElementById("num").value); 

} 

 

function checkEven(){ 

let n=getNumber(); 

if(n%2===0) 

output.innerHTML=n+" is Even"; 

else 

output.innerHTML=n+" is Not Even"; 

} 

 

function checkOdd(){ 

let n=getNumber(); 

if(n%2!==0) 

output.innerHTML=n+" is Odd"; 

else 

output.innerHTML=n+" is Not Odd"; 

} 

 

function checkPrime(){ 

let n=getNumber(); 

let isPrime=true; 

 

if(n<=1) 

isPrime=false; 

 

for(let i=2;i<=n/2;i++){ 

if(n%i===0){ 

isPrime=false; 

break; 

} 

} 

 

if(isPrime) 

output.innerHTML=n+" is Prime"; 

else 

output.innerHTML=n+" is Not Prime"; 

} 

 

function factorial(){ 

let n=getNumber(); 

let fact=1; 

 

if(n<0){ 

output.innerHTML="Factorial not possible"; 

return; 

} 

 

for(let i=1;i<=n;i++){ 

fact*=i; 

} 

 

output.innerHTML="Factorial of "+n+" is "+fact; 

} 

 

function armstrong(){ 

let n=getNumber(); 

let temp=n; 

let sum=0; 

 

while(temp>0){ 

let digit=temp%10; 

sum+=digit*digit*digit; 

temp=Math.floor(temp/10); 

} 

 

if(sum===n) 

output.innerHTML=n+" is Armstrong Number"; 

else 

output.innerHTML=n+" is NOT Armstrong Number"; 

} 

 

</script> 

 

</body> 

</html>
