<!DOCTYPE html> 

<html> 

<head> 

<title>Sign of Product</title> 

</head> 

 

<body> 

 

<script> 

 

function findSign(a, b, c) 

{ 

let product = a * b * c; 

 

if (product > 0) 

{ 

alert("The sign is plus (+)"); 

} 

 

else if (product < 0) 

{ 

alert("The sign is minus (-)"); 

} 

 

else 

{ 

alert("The product is 0"); 

} 

} 

 

let x = 3; 

let y = -7; 

let z = 2; 

 

findSign(x, y, z); 

 

</script> 

 

</body> 

</html>
